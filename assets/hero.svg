<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">Deepak Kumar Kesharwani — hero</title><desc id="d">Engineering Lead in Bengaluru. Animated role carousel with a static first-role fallback.</desc>
<style>
  .display{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
  .mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace}
  .white{fill:#f7fbff}.muted{fill:#8fa9c7}.blue{fill:#3a8cff}.red{fill:#ff4d65}.cyan{fill:#43d9ff}
  .strokeB{stroke:#245d9f}.strokeR{stroke:#7d3346}
  .panel{fill:#081426;stroke:#1f3c61;stroke-width:1.4}
  .glass{fill:#0b1b31;stroke:#224467;stroke-width:1.2}
  .chip{fill:#0c213d;stroke:#2b5f98;stroke-width:1}
  .enter{animation:entry 1s cubic-bezier(.16,1,.3,1) both}
  .pulse{animation:pulse 2.4s ease-in-out infinite both}
  .float{animation:float 6s ease-in-out infinite both}
  .swing{animation:swing 5.8s ease-in-out infinite both;transform-origin:600px 138px}
  .scan{animation:scan 7s ease-in-out infinite both}
  .arrow{animation:nudge 2.2s ease-in-out infinite both}
  .orbitCW{animation:orbitCW 28s linear infinite;transform-origin:600px 370px}
  .orbitCCW{animation:orbitCCW 36s linear infinite;transform-origin:600px 370px}
  .dropSwing{animation:drop .95s cubic-bezier(.2,.9,.25,1) both, swing 5.8s 1.05s ease-in-out infinite;transform-origin:600px 118px}
  .lightSweep{animation:sweep 6.5s ease-in-out infinite}
  .role2{animation:role2 12s linear infinite}.role3{animation:role3 12s linear infinite}.role4{animation:role4 12s linear infinite}
  .countOverlay{opacity:0;animation:countFlash 5.5s ease-in-out infinite}
  @keyframes entry{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes swing{0%,100%{transform:rotate(-.7deg)}50%{transform:rotate(.7deg)}}
  @keyframes scan{0%,100%{opacity:.08}50%{opacity:.2}}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
  @keyframes orbitCW{to{transform:rotate(360deg)}} @keyframes orbitCCW{to{transform:rotate(-360deg)}}
  @keyframes drop{0%{opacity:0;transform:translateY(-100px) rotate(-2deg)}70%{opacity:1;transform:translateY(10px) rotate(1deg)}100%{opacity:1;transform:translateY(0) rotate(-.7deg)}}
  @keyframes sweep{0%,18%{transform:translateX(-460px);opacity:0}35%{opacity:.8}62%{opacity:.8}82%,100%{transform:translateX(1450px);opacity:0}}
  @keyframes role2{0%,22%,100%{opacity:0}27%,45%{opacity:1}50%{opacity:0}}
  @keyframes role3{0%,47%,100%{opacity:0}52%,70%{opacity:1}75%{opacity:0}}
  @keyframes role4{0%,72%,100%{opacity:0}77%,95%{opacity:1}}
  @keyframes countFlash{0%,100%{opacity:0}15%,35%{opacity:.7}45%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){
    .enter,.pulse,.float,.swing,.scan,.arrow,.orbitCW,.orbitCCW,.dropSwing,.lightSweep,.role2,.role3,.role4,.countOverlay{animation:none!important}
  }
</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050d18"/><stop offset=".56" stop-color="#081a31"/><stop offset="1" stop-color="#150b18"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1f74ff"/><stop offset=".6" stop-color="#43d9ff"/><stop offset="1" stop-color="#ff4d65"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" x2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#02070f" flood-opacity=".58"/>
  </filter>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1200" height="620" rx="26" fill="url(#bg)"/>
<g opacity=".14"><path d="M0 500 C220 430 390 550 630 475S1020 390 1200 458" fill="none" stroke="#287cff"/><path d="M0 526 C230 470 380 570 680 500S1020 435 1200 492" fill="none" stroke="#ff4d65"/></g>
<g class="enter">
  <text x="62" y="74" class="mono blue" font-size="14" font-weight="700">DK / ENGINEERING LEAD</text>
  <text x="932" y="74" class="mono muted" font-size="13">BENGALURU, IN</text>
  <circle cx="1123" cy="69" r="5" fill="#43d9ff" class="pulse"/>
  <text x="62" y="147" class="display white" font-size="33">Hi there, I'm</text>
  <text x="62" y="235" class="display white" font-size="82" font-weight="700" letter-spacing="1">DEEPAK KUMAR</text>
  <text x="62" y="314" class="display red" font-size="82" font-weight="700" letter-spacing="1">KESHARWANI</text>

  <text x="66" y="367" class="mono muted" font-size="15">ROLE /</text>
  <g>
    <text x="154" y="367" class="mono white" font-size="16" font-weight="700">Engineering Lead @ Persistent Systems</text>
    <text x="154" y="367" class="mono cyan role2" font-size="16" font-weight="700" opacity="0">Gen AI, Agentic AI &amp; AI Automation Expert</text>
    <text x="154" y="367" class="mono blue role3" font-size="16" font-weight="700" opacity="0">Java Full Stack Architect</text>
    <text x="154" y="367" class="mono red role4" font-size="16" font-weight="700" opacity="0">React • Angular • Spring Boot Microservices</text>
  </g>

  <text x="66" y="414" class="display white" font-size="25" font-weight="700">I debug code AND debug explanations for 10K+ devs</text>
  <text x="66" y="451" class="mono muted" font-size="14">7+ years • since Jul 2019 • Ex @ Infosys, Wipro</text>

  <g transform="translate(66 489)">
    <rect width="340" height="68" rx="18" class="glass"/><text x="22" y="27" class="mono muted" font-size="11">CURRENT BASE</text>
    <text x="22" y="49" class="mono white" font-size="14" font-weight="700">Bengaluru, Karnataka, India</text>
  </g>
  <g transform="translate(427 489)">
    <rect width="312" height="68" rx="18" class="glass"/><text x="22" y="27" class="mono muted" font-size="11">FOCUS</text>
    <text x="22" y="49" class="mono white" font-size="14" font-weight="700">Full Stack • AI • Architecture</text>
  </g>
  <g transform="translate(760 489)">
    <rect width="374" height="68" rx="18" class="glass"/><text x="22" y="27" class="mono muted" font-size="11">NOW</text>
    <text x="22" y="49" class="mono white" font-size="14" font-weight="700">Engineering Lead @ Persistent Systems</text>
  </g>
</g>
<g clip-path="url(#heroClip)" class="lightSweep"><rect x="-350" y="0" width="220" height="620" fill="url(#sweep)" transform="skewX(-14)"/></g>
<defs><clipPath id="heroClip"><rect width="1200" height="620" rx="26"/></clipPath></defs>
</svg>
